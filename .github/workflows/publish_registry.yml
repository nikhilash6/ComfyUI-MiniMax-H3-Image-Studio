name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml"]

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Registry token is not configured
        if: ${{ env.REGISTRY_ACCESS_TOKEN == '' }}
        run: |
          echo "::error::Configure REGISTRY_ACCESS_TOKEN before publishing."
          exit 1

      - name: Prepare Registry changelog
        if: ${{ env.REGISTRY_ACCESS_TOKEN != '' }}
        shell: bash
        run: |
          {
            echo 'COMFY_NODE_CHANGELOG<<__COMFY_CHANGELOG__'
            python scripts/extract_release_notes.py
            echo '__COMFY_CHANGELOG__'
          } >> "$GITHUB_ENV"

      - name: Publish version
        if: ${{ env.REGISTRY_ACCESS_TOKEN != '' }}
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Verify Registry activation
        if: ${{ env.REGISTRY_ACCESS_TOKEN != '' }}
        timeout-minutes: 7
        run: |
          python - <<'PY'
          import json
          import time
          import tomllib
          import urllib.error
          import urllib.request

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          url = "https://api.comfy.org/nodes/minimax-h3-image-studio/versions?include_status_reason=true"
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      versions = json.load(response)
                  release = next((item for item in versions if item["version"] == version), {})
                  status = release.get("status", "not listed")
                  print(f"Registry {version}: {status}", flush=True)
                  if status == "NodeVersionStatusActive":
                      break
                  if status in ("NodeVersionStatusFlagged", "NodeVersionStatusBanned", "NodeVersionStatusDeleted"):
                      raise SystemExit("Registry did not activate this release: " + release.get("status_reason", status))
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"Registry lookup retry: {error}", flush=True)
              time.sleep(20)
          else:
              raise SystemExit("Registry activation not confirmed; inspect its version status before announcing availability.")
          PY
